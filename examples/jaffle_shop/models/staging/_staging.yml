models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_type
        data_tests:
          - accepted_values:
              arguments:
                values: [jaffle, beverage]
  - name: stg_stores
    columns:
      - name: store_id
        data_tests: [unique, not_null]
