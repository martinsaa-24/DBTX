[project]
name = "dbtx"
version = "0.1.0"
description = "A unified runner around dbt that renders configuration-driven reports during `dbt build`."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-core>=1.12,<2",
    "jinja2>=3.1",
    "pydantic>=2",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.30,<1",
    "starlette>=0.37,<1",
]

[project.scripts]
dbtx = "dbtx.cli:main"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9",
    "pytest>=8",
    "httpx>=0.27",
    "dbtx[serve]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: builds the example project with dbt-duckdb (slower)",
    "server: boots a real uvicorn server on a loopback socket",
]
