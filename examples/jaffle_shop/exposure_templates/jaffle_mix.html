<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ report.title }}</title>
<style>
  body { margin: 0; padding: 32px 16px; font: 15px/1.5 system-ui, sans-serif; background: #fffaf2; color: #3b2a1a; }
  main { max-width: 640px; margin: 0 auto; }
  .item { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px dashed #d9c6a5; }
  .units { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>{{ report.title }}</h1>
  {% for r in records %}
  <div class="item">
    <span>{{ loop.index }}. {{ r.product_name }}</span>
    <span class="units">{{ r.units_sold }} sold · ${{ r.revenue }}</span>
  </div>
  {% endfor %}
  <p><small>Generated {{ generated_at }}</small></p>
</main>
</body>
</html>
