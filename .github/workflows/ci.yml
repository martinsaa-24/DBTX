# dbtx CI. The work is done by ci/run.sh, the same script a developer runs locally: it
# mounts a RAM disk (tmpfs) at /mnt/cicd, copies the checkout there, lints, tests and
# packages that copy, and keeps the reports in .build/. This file only provides the
# machine (uv) and uploads .build/. See docs/contributing/ci.md.
name: CI

on:
  # Pull requests into main. actions/checkout checks out the PR's merge commit (the PR
  # branch merged into the current main): the code that would land on main, and what
  # ci/run.sh tests. Re-runs on every push to the PR branch.
  pull_request:
    branches: [main]
  # On demand: Actions tab -> CI -> Run workflow, on any branch (tests its latest commit).
  workflow_dispatch:

jobs:
  ci:
    name: lint, tests, package (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python (pyproject: >=3.10) and the newest.
        python: ["3.10", "3.14"]
    env:
      CICD_ROOT: /mnt/cicd
      CICD_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Mount, copy, lint, test, package (ci/run.sh)
        run: ci/run.sh

      - name: Keep the reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-python-${{ matrix.python }}
          # ci/run.sh's copy of out/: source.txt, the JUnit reports, the parallel test
          # runs' logs and the wheel.
          path: .build
          if-no-files-found: ignore
