[project]
name = "dbtx"
version = "0.1.0"
description = "A unified runner around dbt that renders configuration-driven reports during `dbt build`."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "dbt-core>=1.12,<2",
    "jinja2>=3.1",
    "pydantic>=2",
    "sqlalchemy>=2.0.44,<3",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.30,<1",
    "starlette>=0.37,<1",
]
postgres = [
    "psycopg[binary]>=3.1,<4",
]

[project.scripts]
dbtx = "dbtx.cli:main"

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9",
    "pytest>=8",
    "httpx>=0.27",
    "dbtx[serve]",
    "pixeltable-pgserver>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test's tmp_path directory structure is deleted after the run; only failed
# tests' directories are kept, for debugging.
tmp_path_retention_policy = "failed"
markers = [
    "live: runs real dbt or a real server process (slower)",
    "server: boots a real uvicorn server on a loopback socket",
    "postgres: needs a Postgres server (a throwaway pgserver, started once per test session)",
]
